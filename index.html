<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#d5dbe5;--chip:#e1e6ee;--red:#d62839;--ok:#1f9d6b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eaf0fb;--mut:#9aa7bd;--line:#2a3652;--chip:#222e49;--red:#ff4d5e;--ok:#38c48f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px}
h2{font-size:17px;margin:18px 0 8px}
button,input,select{font:inherit;color:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex:none;min-width:40px;height:38px;padding:0 12px;border:0;border-radius:19px;background:var(--chip);font-weight:700;cursor:pointer}
.chip.on{background:var(--red);color:#fff}
.tabs{display:flex;gap:8px;margin:8px 0 12px}
.day{flex:1;display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.day.on{border-color:var(--ink)}
.dbtn{flex:1;height:44px;border:0;background:transparent;font-weight:800;cursor:pointer}
.day.on .dbtn{background:var(--ink);color:var(--bg)}
.chk{width:42px;border:0;border-left:2px solid var(--line);background:transparent;color:var(--mut);font-size:20px;font-weight:800;cursor:pointer}
.chk.on{background:var(--ok);color:#fff;border-left-color:var(--ok)}
.arrow{width:36px;height:36px;margin-left:6px;padding:0;border:0;border-radius:18px;background:var(--chip);vertical-align:middle;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.arrow svg{width:18px;height:18px;margin:0;transition:transform .2s}
.arrow[aria-expanded=true] svg{transform:rotate(180deg)}
.info{margin:10px 0;padding:10px;border-radius:8px;background:var(--bg)}
.info p{margin:8px 0 0;font-size:14px}
.fr{display:flex;gap:8px}
.fr figure{flex:0 1 calc(50% - 4px);margin:0;text-align:center;font-size:12px;color:var(--mut);max-width:200px}
.fr svg{margin:0 0 2px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.done{border-left-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700}
.kg{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kg small{font-size:14px;font-weight:600;color:var(--mut)}
.meta{color:var(--mut);font-size:13px;text-align:right}
.sub{color:var(--mut);font-size:13px;margin-top:2px;min-height:1em}
.sets{display:flex;gap:6px;margin-top:8px}
.sets label{display:block;font-size:12px;color:var(--mut);text-align:center;margin-bottom:2px}
.ttl{color:var(--mut);font-weight:700;margin:-6px 0 10px}
input[type=text]{width:100%;height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;text-align:center;font-weight:700;font-size:18px}
input.note{text-align:left;font-weight:400;font-size:16px;margin-top:8px;height:40px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>span{flex:1}
.row input{width:84px}
.row.s input{flex:1 1 0;width:auto;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.grid .card{margin:0}
.grid .g{grid-column:1/-1;margin:8px 0 0}
[data-sw]:empty{display:none}
.login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--red);color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center}
.login input{max-width:260px;letter-spacing:.3em}
.login .btn{width:100%;max-width:260px}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prof{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid transparent;background:var(--red);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.prof.on{border-color:var(--ink)}
.barname{font-weight:800;font-size:22px;letter-spacing:-.02em}
.pcard{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 120px;padding:0 10px}
.btn{height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.banner{background:var(--card);border:1px dashed var(--red);border-radius:10px;padding:12px;margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{justify-content:center}
.nav button{flex:1;max-width:213px;height:56px;border:0;background:none;font-weight:700;color:var(--mut);cursor:pointer}
.nav button.on{color:var(--red)}
select{width:100%;height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px}
svg{width:100%;height:auto;display:block;margin:10px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.empty{color:var(--mut)}
.g{color:var(--mut);font-size:13px;margin:14px 0 6px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>

const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const SV=b=>`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="94" x2="96" y2="94" stroke="var(--line)"/>${b}</svg>`;
const WD=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="var(--red)" stroke="none"/>`;
const LN=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--mut)" stroke-width="5"/>`;
function fig(p,w){
  if(typeof p=='string')return p;
  const[hx,hy,sx,sy,px,py,ex,ey,wx,wy,kx,ky,fx,fy]=p;
  return `<circle cx="${hx}" cy="${hy}" r="7"/><line x1="${hx}" y1="${hy}" x2="${sx}" y2="${sy}"/><polyline points="${sx},${sy} ${px},${py} ${kx},${ky} ${fx},${fy}"/><polyline points="${sx},${sy} ${ex},${ey} ${wx},${wy}"/>`+(w?WD(wx,wy):'');
}
const SEAT=LN(28,69,58,69)+LN(34,34,37,66);
const FRONT=(a,y)=>`<circle cx="50" cy="18" r="7"/><line x1="50" y1="25" x2="50" y2="56"/><polyline points="50,56 43,92"/><polyline points="50,56 57,92"/><polyline points="50,30 ${a},${y}"/><polyline points="50,30 ${100-a},${y}"/>`+WD(a,y+2)+WD(100-a,y+2);
const V={
'Bench Press':{w:1,q:LN(8,68,68,68),f:[[14,60,26,62,58,62,28,46,28,32,76,68,72,92],[14,60,26,62,58,62,38,56,28,50,76,68,72,92]],t:'Sırtın bench’e yaslı, ayaklar yerde. Barı göğüs ortasına kontrollü indir, dirsekleri gövdene 45° açıyla tut, sonra yukarı it.'},
'Squat':{w:1,f:[[46,18,48,30,48,56,54,40,50,28,49,74,49,92],[62,36,54,46,42,72,58,54,55,45,66,72,52,92]],t:'Bar omuzlarda, ayaklar omuz genişliğinde. Kalçanı geriye ve aşağı vererek kalça diz hizasına inene kadar çök. Dizlerin ayak ucuyla aynı yöne baksın. Topuklarından iterek kalk.'},
'Over Head Press':{w:1,f:[[46,18,48,30,48,56,56,40,50,28,49,74,49,92],[43,18,48,30,48,56,53,17,50,4,49,74,49,92]],t:'Bar köprücük kemiğinde, karın ve kalça sıkı. Barı yüzünün önünden dikey olarak başının üstüne it, kolların tam uzansın. Belini yaylandırma.'},
'Shoulder Press Machine':{w:1,q:SEAT,f:[[40,28,42,40,42,64,50,52,54,38,64,64,64,92],[40,28,42,40,42,64,56,32,60,16,64,64,64,92]],t:'Sırtını sırtlığa yasla, kulplar omuz hizasında olsun. Kolların uzanana kadar yukarı it, omuzlarını kulaklarına çekme. Yavaşça başlangıca dön.'},
'Romanian DL':{w:1,f:[[46,18,48,30,48,56,50,43,52,58,49,74,49,92],[76,42,66,46,38,56,66,60,64,76,46,75,48,92]],t:'Dizler hafif bükük, bar bacaklara yakın. Kalçanı geriye iterek gövdeni öne eğ, sırtın düz kalsın. Bar diz altına gelince kalçanı öne iterek doğrul.'},
'Barbell Row':{w:1,f:[[74,36,64,42,36,54,64,58,63,72,44,73,46,92],[74,36,64,42,36,54,52,50,62,58,44,73,46,92]],t:'Kalçadan öne eğil, sırt düz, dizler hafif bükük. Barı göbeğine doğru çek, dirsekleri geriye götür ve kürek kemiklerini sık. Kontrollü indir.'},
'Pull Ups':{q:LN(20,14,80,14),f:[[44,30,50,40,50,62,51,27,52,14,52,78,50,92],[46,8,50,22,50,46,44,28,52,14,52,66,50,82]],t:'Çubuğa omuz genişliğinden biraz geniş tut, kollar tam açık. Çeneni çubuğun üstüne çıkarana kadar çek, sonra kontrollü in. Sallanma.'},
'Lateral Raises':{f:[FRONT(38,54),FRONT(24,32)],t:'Dambıllar yanlarda, dirsekler hafif bükük. Kolları yanlara omuz hizasına kadar kaldır, yavaşça indir. Dambılları savurma.'},
'Lat Pulldown':{w:1,q:SEAT,f:[[40,30,42,42,42,66,48,24,52,6,64,66,64,92],[40,30,42,42,42,66,40,58,52,40,64,66,64,92]],t:'Barı omuzlardan geniş tut, göğsünü dik tut. Barı göğsünün üstüne çek, dirsekleri aşağı ve yana indir. Kontrollü şekilde yukarı bırak.'},
'Chest Fly Machine':{w:1,q:SEAT,f:[[40,28,42,40,42,64,34,42,30,38,64,64,64,92],[40,28,42,40,42,64,54,42,66,42,64,64,64,92]],t:'Sırtın yaslı, kulplar göğüs hizasında. Kolları önde birleşene kadar kapat ve göğsünü sık. Yavaşça aç, omuzlarını öne düşürme.'},
'Leg Extension':{q:SEAT,f:[[36,26,38,38,40,64,44,52,48,64,60,66,60,90],[36,26,38,38,40,64,44,52,48,64,60,66,86,58]],t:'Sırtını yasla, pedi bileklerinin üstüne ayarla. Bacaklarını tam açana kadar kaldır ve üstte 1 saniye sık. Yavaşça indir.'},
'Overhead Triceps Extension':{w:1,f:[[52,20,48,30,48,56,47,16,47,3,49,74,49,92],[52,20,48,30,48,56,47,14,38,24,49,74,49,92]],t:'Dambılı iki elle başının üstünde tut, dirsekler yukarıda sabit. Dambılı başının arkasına indir, sonra kolları tekrar uzat. Dirsekleri açma.'},
'Incline Dumbbell Curl':{w:1,q:LN(22,40,36,70),f:[[22,32,30,42,42,68,32,60,34,76,62,68,62,92],[22,32,30,42,42,68,32,60,44,52,62,68,62,92]],t:'Eğimli bench’e yaslan, kollar aşağı sarkık. Dirsekler sabit, dambılları omuza doğru kıvır. Yavaşça tam açıya indir.'},
'Crunch':{f:[[16,84,28,84,54,84,22,76,18,82,68,68,76,90],[32,64,36,74,54,84,30,68,28,60,68,68,76,90]],t:'Sırtüstü yat, dizler bükük, eller kulak arkasında. Omuzlarını yerden kaldırıp karnını sık, boynunu çekme. Yavaşça in.'},
'Leg Raises':{f:[[14,84,26,84,50,84,36,86,46,86,66,84,84,84],[14,84,26,84,50,84,36,86,46,86,50,62,50,40]],t:'Sırtüstü yat, belini yere bastır. Düz bacaklarını dikey olana kadar kaldır, topuklar yere değmeden yavaşça indir.'},
'Plank':{f:[[20,66,30,70,60,78,30,90,46,90,75,83,90,90]],t:'Dirsekler omuz altında, vücudun baştan topuğa düz bir çizgi olsun. Karın ve kalçanı sık, belin çökmesin. Süre dolana kadar pozisyonu koru.'}
};
function guide(id){
  const v=V[E[id].n],L=['Başlangıç','Bitiş'];
  return `<div class="fr">${v.f.map((p,i)=>`<figure>${SV((v.q||'')+fig(p,v.w))}${v.f.length>1?L[i]:'Duruş'}</figure>`).join('')}</div><p>${v.t}</p>`;
}

const mr=(x,s=2.5)=>Math.round(x/s)*s;
const fmt=n=>n==null?'—':String(Math.round(n*10)/10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=(n,g,p,i,goal,tg,o={})=>({n,g,p,i,k:'t',ns:3,si:2,goal,tg,wu:[.6,.85],...o});
const S_=(n,g,p,i,goal,tg,rpe)=>({n,g,p,i,k:'s',ns:3,goal,tg,rpe});
const B=(n,o={})=>({n,g:'',k:'b',ns:3,tg:'3xmax',rpe:9,...o});
const H={ns:4,si:3,goal:5,tg:'4x5+',wu:[.6,.7,.85],main:1};
const E={
 7:T('Bench Press','G1',.8,2.5,5,'4x5+',H),8:T('Squat','G1',.7,5,5,'4x5+',H),9:T('Over Head Press','G1',.7,2.5,5,'4x5+',H),
 12:T('Shoulder Press Machine','G2',.6,2.5,10,'3x10'),13:T('Romanian DL','G2',.6,5,8,'3x8'),
 14:T('Bench Press','G2',.6,2.5,10,'3x10'),15:T('Barbell Row','G2',.6,2.5,10,'4x10',{ns:4,si:3}),16:T('Squat','G2',.6,2.5,10,'3x10'),
 17:B('Pull Ups'),
 20:S_('Lateral Raises','G3',.6,5,42,'3x10-14',9),21:S_('Lat Pulldown','G3',.65,5,42,'3x10-14',8),
 22:S_('Chest Fly Machine','G3',.65,5,42,'3x10-14',8),23:S_('Leg Extension','G3',.65,5,42,'3x10-14',9),
 26:S_('Overhead Triceps Extension','G4',.75,5,36,'3x8-12',9),27:S_('Incline Dumbbell Curl','G4',.75,5,36,'3x8-12',9),
 28:B('Crunch'),29:B('Leg Raises'),30:B('Plank',{u:'sn'})
};
const INIT=[7,8,9,12,13,14,15,16,20,21,22,23,26,27];
const WO={A:[7,12,13,21,23,28],B:[8,14,17,20,27,29],C:[9,16,15,22,26,30],R1:[8,7,17],R2:[9,13,15]};
const TAB={A:'Gün 1',B:'Gün 2',C:'Gün 3',R1:'Gün 1',R2:'Gün 2'};

let S={done:{},bw:null,init:{},logs:{},wkbw:{},wk:1,tab:'A',view:'train',metric:0};
try{const r=localStorage.getItem('sh_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let AUTH=false;try{AUTH=localStorage.getItem('sh_auth')=='1'}catch(e){}
function login(){
  const pw=document.getElementById('pw');
  if(pw.value.trim()==='231423'){AUTH=true;S.view='home';try{localStorage.setItem('sh_auth','1')}catch(e){}render()}
  else{document.getElementById('err').textContent='Şifre yanlış, tekrar dene.';pw.value='';pw.focus()}
}
const save=()=>{try{localStorage.setItem('sh_v1',JSON.stringify(S))}catch(e){}};

const sets=(wk,id)=>Array.from((S.logs[wk+'-'+id]||{}).s||[],v=>v==null?null:v);
const sum3=s=>[0,1,2].reduce((a,i)=>a+(s[i]||0),0);
function start(id){const x=S.init[id],e=E[id];if(!x||!x.w||!x.r)return null;return mr((x.w*x.r*.0333+x.w)*.85*e.p)}
function W(wk,id){
  if(wk==1)return start(id);
  const prev=W(wk-1,id);if(prev==null)return null;
  const e=E[id],s=sets(wk-1,id);
  if(!s.some(v=>v!=null))return prev;
  const ok=e.k=='t'?(s[e.si]||0)>=e.goal:sum3(s)>=e.goal;
  return ok?prev+e.i:(e.k=='t'?mr(prev*.9):prev);
}
function ORM(wk,id){
  const w=W(wk,id),m=Math.max(0,...sets(wk,id).map(v=>v||0));
  return w&&m?mr(w*m*.0333+w,.5):null;
}

function card(id,wk){
  const e=E[id],rest=wk==13,ns=rest?3:e.ns;
  let w=null;
  if(e.k!='b')w=rest?(W(12,id)==null?null:mr(W(12,id)*.7)):W(wk,id);
  const L=S.logs[wk+'-'+id]||{s:[],n:''};
  const wu=(!rest&&e.wu&&w!=null)?'Isınma: '+e.wu.map(f=>fmt(mr(w*f))).join(' · ')+' kg':'';
  const tg=rest?'3x5':e.tg, u=e.u||'';
  let inp='';
  for(let i=0;i<ns;i++){
    const plus=!rest&&e.tg=='4x5+'&&i==3;
    inp+=`<div style="flex:1"><label>Set ${i+1}${plus?' (5+)':''}</label><input type="text" inputmode="decimal" data-k="set" data-id="${id}" data-i="${i}" value="${esc(L.s[i]!=null?L.s[i]:'')}" aria-label="${esc(e.n)} set ${i+1}"></div>`;
  }
  return `<div class="card" data-card="${id}">
    <div class="top"><div><div class="nm">${esc(e.n)}<button class="arrow" data-info="${id}" aria-expanded="false" aria-label="${esc(e.n)} nasıl yapılır">${CH}</button></div><div class="sub">${esc(wu)}</div></div>
    <div class="kg">${e.k=='b'?'<small>vücut a.</small>':fmt(w)+' <small>kg</small>'}</div></div>
    <div class="meta" style="text-align:left;margin-top:4px">${tg}${e.rpe&&!rest?' · RPE '+e.rpe:''}${u?' · saniye':''}</div>
    <div class="info" id="info-${id}" hidden></div><div class="sets">${inp}</div>
    <input class="note" type="text" data-k="note" data-id="${id}" placeholder="Not" value="${esc(L.n||'')}">
    <div class="sub" data-orm style="margin-top:6px"></div><div class="sub" data-next></div>
  </div>`;
}

const wkDone=w=>(w==13?['R1','R2']:['A','B','C']).every(t=>S.done[w+'-'+t]);
function train(){
  const wk=S.wk,rest=wk==13,tabs=rest?['R1','R2']:['A','B','C'];
  if(!tabs.includes(S.tab))S.tab=tabs[0];
  let h='<button class="btn alt" data-view="home" style="margin-bottom:10px">← Anasayfa</button><div class="ttl">'+(rest?'Dinlenme haftası':'Hafta '+wk)+' · '+TAB[S.tab]+'</div><div class="chips" id="chips">';
  for(let i=1;i<=12;i++)h+=`<button class="chip${wk==i?' on':''}" data-wk="${i}" aria-label="Hafta ${i}">${i}${wkDone(i)?' ✓':''}</button>`;
  h+=`<button class="chip${rest?' on':''}" data-wk="13">Dinlenme${wkDone(13)?' ✓':''}</button></div>`;
  h+=`<div class="tabs">${tabs.map(t=>{const d=S.done[wk+'-'+t];return `<div class="day${S.tab==t?' on':''}"><button class="dbtn" data-tab="${t}">${TAB[t]}</button><button class="chk${d?' on':''}" data-chk="${t}" aria-pressed="${!!d}" aria-label="${TAB[t]} tamamlandı">✓</button></div>`}).join('')}</div>`;
  if(INIT.some(id=>start(id)==null))h+=`<div class="banner">Ağırlıkların hesaplanması için önce başlangıç bilgilerini gir.<br><button class="btn" style="margin-top:8px" data-view="setup">Başlangıca git</button></div>`;
  if(rest)h+='<p class="empty">Bu hafta sadece 2 gün hafif antrenman yap. Ağırlıklar Hafta 12’nin %70’i.</p>';
  h+=`<div class="row"><span>Bu haftaki vücut ağırlığın</span><input type="text" inputmode="decimal" data-k="wbw" value="${esc(S.wkbw[wk]!=null?S.wkbw[wk]:'')}" placeholder="kg" aria-label="Vücut ağırlığı"></div>`;
  h+=WO[S.tab].map(id=>card(id,wk)).join('');
  return h;
}

function setup(){
  let h='<button class="btn alt" data-view="home">← Anasayfa</button><div class="pcard"><div class="avatar" style="width:56px;height:56px;font-size:24px">E</div><b>Enes</b></div><h2>Başlangıç</h2><div class="row"><span>Vücut ağırlığın (kg)</span><input type="text" inputmode="decimal" data-k="bw" value="'+esc(S.bw!=null?S.bw:'')+'"></div>';
  h+='<p class="empty">Her hareket için yapabildiğin ağırlığı ve tekrar sayısını gir. Başlangıç ağırlıkların buradan hesaplanır.</p>';
  let g='';h+='<div class="grid">';
  INIT.forEach(id=>{
    const e=E[id],x=S.init[id]||{};
    if(e.g!=g){g=e.g;h+=`<div class="g">${g}</div>`}
    h+=`<div class="card" style="border-left-width:1px"><div class="top"><div class="nm">${esc(e.n)}</div><div class="meta">${e.tg}</div></div>
    <div class="row s" style="margin-top:6px"><input type="text" inputmode="decimal" data-k="iw" data-id="${id}" placeholder="kg" value="${esc(x.w!=null?x.w:'')}" aria-label="${esc(e.n)} ağırlık"><input type="text" inputmode="numeric" data-k="ir" data-id="${id}" placeholder="tekrar" value="${esc(x.r!=null?x.r:'')}" aria-label="${esc(e.n)} tekrar"></div><div class="sub" data-sw="${id}"></div></div>`;
  });
  h+='</div><h2>Yedek</h2><p class="empty">Veriler bu cihazın tarayıcısında saklanır. Yedek alırsan başka cihaza taşıyabilirsin.</p><div class="btns"><button class="btn alt" data-act="export">Yedeği indir</button><button class="btn alt" data-act="import">Yedeği yükle</button><button class="btn alt" data-act="reset">Sıfırla</button><button class="btn alt" data-act="logout">Çıkış yap</button></div><input type="file" id="file" accept="application/json" hidden>';
  return h;
}

const METRICS=[
  ['Bench Press 1TM (kg)',wk=>ORM(wk,7)],['Squat 1TM (kg)',wk=>ORM(wk,8)],['Over Head Press 1TM (kg)',wk=>ORM(wk,9)],
  ['Romanian DL ağırlığı (kg)',wk=>sets(wk,13).some(v=>v!=null)?W(wk,13):null],
  ['Barbell Row ağırlığı (kg)',wk=>sets(wk,15).some(v=>v!=null)?W(wk,15):null],
  ['Vücut ağırlığı (kg)',wk=>S.wkbw[wk]!=null?S.wkbw[wk]:(wk==1?S.bw:null)]
];
function chart(pts){
  if(!pts.length)return '<p class="empty">Bu grafik için henüz veri yok. Antrenmanlarda set tekrarlarını gir.</p>';
  const Wd=320,Ht=170,pl=38,pr=12,pt=12,pb=26,vs=pts.map(p=>p[1]);
  let lo=Math.min(...vs),hi=Math.max(...vs);if(lo==hi){lo-=2;hi+=2}
  const x=w=>pl+(w-1)/11*(Wd-pl-pr),y=v=>pt+(1-(v-lo)/(hi-lo))*(Ht-pt-pb);
  let s=`<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Haftalık grafik">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${fmt(v)}</text>`});
  for(let i=1;i<=12;i+=1)s+=`<text x="${x(i)}" y="${Ht-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${i}</text>`;
  s+=`<polyline fill="none" stroke="var(--red)" stroke-width="2.5" points="${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="var(--red)"/>`});
  return s+'</svg>';
}
function home(){
  let h='';
  if(INIT.some(id=>start(id)==null))h+='<div class="banner">Ağırlıkların hesaplanması için önce başlangıç bilgilerini gir.<br><button class="btn" style="margin-top:8px" data-view="setup">Başlangıç bilgileri</button></div>';
  h+=`<button class="btn" style="width:100%;height:56px;font-size:18px;margin-bottom:6px" data-view="train">Antrenmana git · ${S.wk==13?'Dinlenme haftası':'Hafta '+S.wk}</button>`;
  return h+graph();
}
function graph(){
  const m=METRICS[S.metric]||METRICS[0],pts=[];
  for(let wk=1;wk<=12;wk++){const v=m[1](wk);if(v)pts.push([wk,v])}
  let h='<h2>İlerleme</h2><select data-k="metric" aria-label="Grafik seç">'+METRICS.map((x,i)=>`<option value="${i}"${i==S.metric?' selected':''}>${x[0]}</option>`).join('')+'</select>'+chart(pts);
  if(pts.length)h+='<table>'+pts.map(p=>`<tr><td>Hafta ${p[0]}</td><td><b>${fmt(p[1])} kg</b></td></tr>`).join('')+'</table>';
  return h;
}

const root=document.getElementById('app');
function render(){
  if(!AUTH){
    root.innerHTML='<div class="login"><div class="avatar" aria-hidden="true">E</div><h1 style="margin:0">Enes</h1><p class="empty" style="margin:0">Devam etmek için şifreni gir</p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Şifre" aria-label="Şifre"><div class="err" id="err" role="alert"></div><button class="btn" data-act="login">Giriş</button></div>';
    document.getElementById('pw').focus();return;
  }
  const VW={home:['Anasayfa',home],train:['Antrenman',train],setup:['Profil',setup]},cur=VW[S.view]||VW.home;
  root.innerHTML=`<div class="bar"><button class="prof${S.view=='setup'?' on':''}" data-view="setup" aria-label="Profil">E</button><div class="barname">${cur[0]}</div></div>`+cur[1]();
  const on=document.querySelector('.chip.on'),ch=document.getElementById('chips');if(on&&ch)ch.scrollLeft=on.offsetLeft-ch.clientWidth/2+on.offsetWidth/2;
  refresh();
}
function refresh(){
  const wk=S.wk;
  document.querySelectorAll('[data-card]').forEach(c=>{
    const id=c.dataset.card,e=E[id],ns=wk==13?3:e.ns,s=sets(wk,id);
    const n=s.filter(v=>v!=null).length;
    c.classList.toggle('done',n>=ns);
    const nx=c.querySelector('[data-next]');
    if(nx)nx.textContent=(wk<12&&n>=ns&&e.k!='b'&&W(wk+1,id)!=null)?'Gelecek hafta: '+fmt(W(wk+1,id))+' kg':'';
    const o=c.querySelector('[data-orm]');
    if(o){const v=e.main&&wk<13?ORM(wk,id):null;o.textContent=v?'Tahmini 1 tekrar max: '+fmt(v)+' kg':''}
  });
  document.querySelectorAll('[data-sw]').forEach(el=>{
    const id=el.dataset.sw,x=S.init[id]||{},st=start(id);
    el.textContent=st==null?'':'Başlangıç: '+fmt(st)+' kg (1TM '+fmt(mr(x.w*x.r*.0333+x.w,.5))+')';
  });
}

root.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;if(!d.k)return;
  const raw=t.value.replace(',','.'),num=raw===''||isNaN(parseFloat(raw))?null:parseFloat(raw);
  if(d.k=='metric'){S.metric=+t.value;save();render();return}
  if(d.k=='bw')S.bw=num;
  else if(d.k=='wbw')S.wkbw[S.wk]=num;
  else if(d.k=='iw'||d.k=='ir'){const o=S.init[d.id]=S.init[d.id]||{};o[d.k=='iw'?'w':'r']=num}
  else if(d.k=='set'||d.k=='note'){
    const key=S.wk+'-'+d.id,L=S.logs[key]=S.logs[key]||{s:[],n:''};
    if(d.k=='set')L.s[+d.i]=num;else L.n=t.value;
  }
  save();refresh();
});
root.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='pw'){e.preventDefault();login();return}
  if(e.key!='Enter'||e.target.tagName!='INPUT')return;
  const all=[...root.querySelectorAll('input[type=text]')],n=all[all.indexOf(e.target)+1];
  e.preventDefault();n?n.focus():e.target.blur();
});
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.act=='login'){login();return}
  if(d.act=='logout'){AUTH=false;try{localStorage.removeItem('sh_auth')}catch(x){}render();return}
  if(d.info){const p=document.getElementById('info-'+d.info),o=b.getAttribute('aria-expanded')=='true';b.setAttribute('aria-expanded',String(!o));p.hidden=o;if(!o&&!p.innerHTML)p.innerHTML=guide(d.info);return}
  if(d.chk){const k=S.wk+'-'+d.chk;S.done[k]=!S.done[k];save();render();return}
  if(d.wk){S.wk=+d.wk;save();render();window.scrollTo(0,0);return}
  if(d.tab){S.tab=d.tab;save();render();window.scrollTo(0,0);return}
  if(d.view){S.view=d.view;save();render();window.scrollTo(0,0);return}
  if(d.act=='export'){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    a.download='superhero-yedek.json';a.click();return}
  if(d.act=='import'){document.getElementById('file').click();return}
  if(d.act=='reset'&&confirm('Tüm veriler silinecek. Emin misin?')){
    S={done:{},bw:null,init:{},logs:{},wkbw:{},wk:1,tab:'A',view:'setup',metric:0};save();render()}
});
root.addEventListener('change',e=>{
  if(e.target.id!='file'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render()}catch(x){alert('Yedek dosyası okunamadı.')}};
  r.readAsText(e.target.files[0]);
});
S.view='home';
render();
</script>
</body>
</html>
